name: Release builds

# Started by hand from the Actions tab (Run workflow, on main). It builds the AppImage, the dmg and the Windows zip and puts them on a DRAFT
# release named after the version in gui/Cargo.toml, on the commit that was built. Nothing is public until the draft is published on the
# releases page, which creates the tag on that commit. A failed build leaves only a draft to delete. Untick "Make a draft release" to
# build without a release (the files are then kept as workflow artifacts).
on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Make a draft release with the files"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  draft:
    if: ${{ inputs.draft }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' gui/Cargo.toml | head -1)
          TAG="v$VER"
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::The tag $TAG already exists. Bump the version in Cargo.toml, or delete that tag and its release first."; exit 1
          fi
          # a release of this version that is already public is left alone; an old draft of it is replaced
          found=$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq ".[] | select(.tag_name == \"$TAG\") | [.id, .draft] | @tsv")
          if [ -n "$found" ]; then
            if [ "$(echo "$found" | head -1 | cut -f2)" = true ]; then
              echo "$found" | cut -f1 | while read -r id; do gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"; done
            else echo "::error::$TAG is already published."; exit 1; fi
          fi
          gh release create "$TAG" --draft --target "$GITHUB_SHA" --title "$TAG" \
            --notes "Draft made by the Release builds workflow from commit $GITHUB_SHA. Replace this text with the changelog, check the files, then publish."
  linux-appimage:
    needs: draft
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    # the oldest runner on purpose: an AppImage runs on systems with the same glibc or newer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y zsync appstream libxkbcommon-dev libxkbcommon-x11-0 libxcb-xkb1 libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # GitHub's runners have no FUSE, so appimagetool unpacks itself and runs from there
          printf '#!/bin/sh\nexec "%s/appimagetool" --appimage-extract-and-run "$@"\n' "$PWD" > appimagetool-run
          chmod +x appimagetool-run
      - name: Build the AppImage
        run: APPIMAGETOOL="$PWD/appimagetool-run" sh ./packaging/build-appimage.sh
      - name: Check that the AppImage starts
        run: |
          # a window must open and stay: a missing library makes the program exit within seconds
          sudo apt-get install -y xvfb
          chmod +x putiacnc-*-x86_64.AppImage
          export PUTIACNC_CONFIG_DIR="$(mktemp -d)" PUTIACNC_SKIP_SETUP=1 DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          ./putiacnc-*-x86_64.AppImage --appimage-extract-and-run &
          pid=$!
          sleep 12
          kill -0 "$pid" || { echo "the AppImage exited early"; exit 1; }
          kill "$pid"
      - uses: actions/upload-artifact@v6
        with:
          name: linux-appimage
          path: |
            putiacnc-*-x86_64.AppImage
            putiacnc-*-x86_64.AppImage.zsync
      - name: Version
        id: ver
        if: ${{ inputs.draft }}
        shell: bash
        run: echo "tag=v$(sed -n 's/^version = "\(.*\)"/\1/p' gui/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - name: Attach to the draft release
        if: ${{ inputs.draft }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          draft: true
          target_commitish: ${{ github.sha }}
          files: |
            putiacnc-*-x86_64.AppImage
            putiacnc-*-x86_64.AppImage.zsync

  macos-dmg:
    needs: draft
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      # objc2 0.4 (through eframe 0.27 / winit 0.29) does not compile with Rust 1.100: stay on 1.99 until eframe is updated
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      - name: Build the dmg
        run: sh ./packaging/build-dmg.sh
      - uses: actions/upload-artifact@v6
        with:
          name: macos-dmg
          path: PutiaCNC-*-macos.dmg
      - name: Version
        id: ver
        if: ${{ inputs.draft }}
        shell: bash
        run: echo "tag=v$(sed -n 's/^version = "\(.*\)"/\1/p' gui/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - name: Attach to the draft release
        if: ${{ inputs.draft }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          draft: true
          target_commitish: ${{ github.sha }}
          files: |
            PutiaCNC-*-macos.dmg

  windows-zip:
    needs: draft
    if: ${{ !cancelled() && needs.draft.result != 'failure' }}
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release -p putiacnc-gui
      - name: Package (portable zip)
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' gui/Cargo.toml | head -1)
          D="PutiaCNC-$VER-windows-x86_64"
          mkdir "$D"
          cp target/release/putiacnc.exe "$D/PutiaCNC.exe"
          cp LICENSE THIRD-PARTY-LICENSES.txt README.md "$D/"
          7z a "$D.zip" "$D"
      - uses: actions/upload-artifact@v6
        with:
          name: windows-zip
          path: PutiaCNC-*-windows-x86_64.zip
      - name: Version
        id: ver
        if: ${{ inputs.draft }}
        shell: bash
        run: echo "tag=v$(sed -n 's/^version = "\(.*\)"/\1/p' gui/Cargo.toml | head -1)" >> "$GITHUB_OUTPUT"
      - name: Attach to the draft release
        if: ${{ inputs.draft }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          draft: true
          target_commitish: ${{ github.sha }}
          files: |
            PutiaCNC-*-windows-x86_64.zip

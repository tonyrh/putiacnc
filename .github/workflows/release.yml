name: Release builds

# Runs when a version tag (v0.2.0 ...) is pushed, e.g. by publishing a release on GitHub,
# and can be started by hand from the Actions tab (the files are then kept as workflow artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos-dmg:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the dmg
        run: ./packaging/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: PutiaCNC-*-macos.dmg
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PutiaCNC-*-macos.dmg

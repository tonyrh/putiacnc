name: Release builds

# Runs when a version tag (v0.2.0 ...) is pushed, e.g. by publishing a release on GitHub,
# and can be started by hand from the Actions tab (the files are then kept as workflow artifacts).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux-appimage:
    # the oldest runner on purpose: an AppImage runs on systems with the same glibc or newer
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y appstream libxkbcommon-dev libxkbcommon-x11-0 libxcb-xkb1 libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          # GitHub's runners have no FUSE, so appimagetool unpacks itself and runs from there
          printf '#!/bin/sh\nexec "%s/appimagetool" --appimage-extract-and-run "$@"\n' "$PWD" > appimagetool-run
          chmod +x appimagetool-run
      - name: Build the AppImage
        run: APPIMAGETOOL="$PWD/appimagetool-run" sh ./packaging/build-appimage.sh
      - name: Check that the AppImage starts
        run: |
          # a window must open and stay: a missing library makes the program exit within seconds
          sudo apt-get install -y xvfb
          chmod +x putiacnc-*-x86_64.AppImage
          export PUTIACNC_CONFIG_DIR="$(mktemp -d)" PUTIACNC_SKIP_SETUP=1 DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          ./putiacnc-*-x86_64.AppImage --appimage-extract-and-run &
          pid=$!
          sleep 12
          kill -0 "$pid" || { echo "the AppImage exited early"; exit 1; }
          kill "$pid"
      - uses: actions/upload-artifact@v6
        with:
          name: linux-appimage
          path: putiacnc-*-x86_64.AppImage
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: putiacnc-*-x86_64.AppImage

  macos-dmg:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the dmg
        run: sh ./packaging/build-dmg.sh
      - uses: actions/upload-artifact@v6
        with:
          name: macos-dmg
          path: PutiaCNC-*-macos.dmg
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: PutiaCNC-*-macos.dmg

  windows-zip:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release -p putiacnc-gui
      - name: Package (portable zip)
        run: |
          VER=$(sed -n 's/^version = "\(.*\)"/\1/p' gui/Cargo.toml | head -1)
          D="PutiaCNC-$VER-windows-x86_64"
          mkdir "$D"
          cp target/release/putiacnc.exe "$D/PutiaCNC.exe"
          cp LICENSE THIRD-PARTY-LICENSES.txt README.md "$D/"
          7z a "$D.zip" "$D"
      - uses: actions/upload-artifact@v6
        with:
          name: windows-zip
          path: PutiaCNC-*-windows-x86_64.zip
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: PutiaCNC-*-windows-x86_64.zip

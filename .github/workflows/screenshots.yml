name: Screenshots

# Builds the app on Linux, macOS and Windows, opens an example project and photographs the screen.
# Start it by hand from the Actions tab; the pictures are kept as the "screenshots-*" artifacts.
on:
  workflow_dispatch:

jobs:
  shots:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux }
          - { os: macos-14, name: macos }
          - { os: windows-latest, name: windows }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick libgl1-mesa-dri libgl1 libxkbcommon-x11-0 libssl-dev pkg-config fonts-dejavu-core

      - name: Build
        run: cargo build --release -p putiacnc-gui

      - name: Take the screenshots
        run: |
          mkdir shots
          BIN=target/release/putiacnc
          [ "$RUNNER_OS" = "Windows" ] && BIN=target/release/putiacnc.exe
          PROJ="$PWD/tests/data/outside_holes.project.json"

          capture() {  # $1 = file name
            case "$RUNNER_OS" in
              Linux) import -window root "shots/$1" ;;
              macOS) screencapture -x "shots/$1" ;;
              Windows) powershell -NoProfile -Command "Add-Type -AssemblyName System.Windows.Forms,System.Drawing; \$b=[System.Windows.Forms.SystemInformation]::VirtualScreen; \$bmp=New-Object System.Drawing.Bitmap \$b.Width,\$b.Height; \$g=[System.Drawing.Graphics]::FromImage(\$bmp); \$g.CopyFromScreen(\$b.Left,\$b.Top,0,0,\$bmp.Size); \$bmp.Save('shots/$1')" ;;
            esac
          }

          shoot() {  # $1 = file name, rest = environment settings
            local out=$1; shift
            env "$@" "$BIN" "$PROJ" > "shots/log-$out.txt" 2>&1 &
            local pid=$!
            sleep 12
            capture "$out" || echo "capture failed"
            kill $pid 2>/dev/null || true
            sleep 2
          }

          if [ "$RUNNER_OS" = "Linux" ]; then
            Xvfb :99 -screen 0 1600x1000x24 &
            export DISPLAY=:99
            sleep 2
          fi

          shoot "${{ matrix.name }}-2d.png" PUTIACNC_SELECT_ALL=1
          shoot "${{ matrix.name }}-3d.png" PUTIACNC_VIEW=3d PUTIACNC_PLAY=0.6
          shoot "${{ matrix.name }}-tools.png" PUTIACNC_SHOW_TOOLS=1
          ls -la shots

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshots-${{ matrix.name }}
          path: shots/

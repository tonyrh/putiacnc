name: Screenshots

# Builds the app on Linux and macOS, opens the README's example sign and photographs the screen:
# a 2D picture (dark, millimetres) and a 3D picture (light, inches as fractions) on each system.
# Start it by hand from the Actions tab; the pictures are kept as the "screenshots-*" artifacts.
on:
  workflow_dispatch:

jobs:
  shots:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, name: linux }
          - { os: macos-15, name: macos }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb imagemagick libgl1-mesa-dri libgl1 libxkbcommon-x11-0 libssl-dev pkg-config fonts-dejavu-core

      - name: Build
        run: cargo build --release -p putiacnc-gui

      - name: Take the screenshots
        run: |
          mkdir shots
          BIN=target/release/putiacnc
          [ "$RUNNER_OS" = "Windows" ] && BIN=target/release/putiacnc.exe
          MM="$PWD/docs/screenshot-projects/sign-mm.project.json"
          IN="$PWD/docs/screenshot-projects/sign-in.project.json"
          export PUTIACNC_CONFIG_DIR="$RUNNER_TEMP/cfg" PUTIACNC_SKIP_SETUP=1 PUTIACNC_WIN=1876x1077 PUTIACNC_HIDE=machine

          capture() {  # $1 = file name
            case "$RUNNER_OS" in
              Linux) import -window root "shots/$1" ;;
              macOS) screencapture -x "shots/$1" ;;
            esac
          }

          shoot() {  # $1 = file name, $2 = project, rest = environment settings
            local out=$1 proj=$2; shift 2
            env "$@" "$BIN" "$proj" > "shots/log-$out.txt" 2>&1 &
            local pid=$!
            sleep 20
            capture "$out" || echo "capture failed"
            kill $pid 2>/dev/null || true
            sleep 2
          }

          if [ "$RUNNER_OS" = "Linux" ]; then
            Xvfb :99 -screen 0 1920x1080x24 &
            export DISPLAY=:99
            sleep 2
          fi

          shoot "${{ matrix.name }}-2d.png" "$MM" PUTIACNC_THEME=dark PUTIACNC_OP=1 PUTIACNC_HIDE=machine,toolpaths
          shoot "${{ matrix.name }}-3d.png" "$IN" PUTIACNC_THEME=light PUTIACNC_OP=2 PUTIACNC_VIEW=3d PUTIACNC_PLAY=1.0 PUTIACNC_FRACTIONS=1
          ls -la shots

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screenshots-${{ matrix.name }}
          path: shots/

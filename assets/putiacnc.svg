<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#f1d3a2"/>
      <stop offset="1" stop-color="#d4a465"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f969e"/>
      <stop offset="0.35" stop-color="#e9edf1"/>
      <stop offset="0.65" stop-color="#c3c9d0"/>
      <stop offset="1" stop-color="#7c838b"/>
    </linearGradient>
    <linearGradient id="cutter" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6d747c"/>
      <stop offset="0.4" stop-color="#cfd5db"/>
      <stop offset="1" stop-color="#6d747c"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.5"/></filter>
    <clipPath id="tile"><rect x="16" y="16" width="224" height="224" rx="52"/></clipPath>
  </defs>
  <!-- tile shadow -->
  <rect x="16" y="22" width="224" height="224" rx="52" fill="#000" opacity="0.22" filter="url(#soft)"/>
  <rect x="16" y="16" width="224" height="224" rx="52" fill="url(#wood)"/>
  <g clip-path="url(#tile)">
    <!-- grain -->
    <g fill="none" stroke="#b9823f" stroke-width="2.2" stroke-linecap="round" opacity="0.28">
      <path d="M0 62 C70 48 150 76 256 56"/>
      <path d="M0 98 C80 84 160 112 256 92"/>
      <path d="M0 150 C70 136 160 166 256 144"/>
      <path d="M0 196 C80 182 170 210 256 190"/>
      <path d="M0 232 C90 220 170 246 256 228"/>
    </g>
    <!-- groove: rim, floor, toolpath -->
    <path d="M40 196 C78 112 120 210 150 142" fill="none" stroke="#fff3dc" stroke-width="30" stroke-linecap="round" opacity="0.55"/>
    <path d="M40 198 C78 114 120 212 150 144" fill="none" stroke="#8c5a2a" stroke-width="27" stroke-linecap="round"/>
    <path d="M40 196 C78 112 120 210 150 142" fill="none" stroke="#5b3818" stroke-width="21" stroke-linecap="round"/>
    <path d="M40 196 C78 112 120 210 150 142" fill="none" stroke="#62a0ea" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="1 9"/>
    <!-- chips -->
    <g fill="#f6dfb4" stroke="#b9823f" stroke-width="1">
      <ellipse cx="176" cy="170" rx="5" ry="2.6" transform="rotate(-30 176 170)"/>
      <ellipse cx="190" cy="152" rx="4" ry="2.2" transform="rotate(20 190 152)"/>
      <ellipse cx="166" cy="186" rx="3.6" ry="2" transform="rotate(50 166 186)"/>
    </g>
    <!-- cutter shadow -->
    <g transform="translate(150 148) rotate(32)" opacity="0.28" filter="url(#soft)"><rect x="-17" y="-150" width="34" height="150" rx="6" fill="#000"/></g>
    <!-- end mill, tip at the end of the groove -->
    <g transform="translate(150 142) rotate(32)">
      <rect x="-17" y="-190" width="34" height="96" rx="5" fill="url(#steel)"/>
      <rect x="-17" y="-98" width="34" height="9" fill="#5d646c"/>
      <rect x="-17" y="-92" width="34" height="92" rx="4" fill="url(#cutter)"/>
      <g stroke="#4c535a" stroke-width="4" stroke-linecap="round" opacity="0.85">
        <path d="M-17 -72 L17 -54"/><path d="M-17 -48 L17 -30"/><path d="M-17 -24 L17 -6"/>
      </g>
    </g>
  </g>
</svg>

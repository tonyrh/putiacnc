[package]
name = "putiacnc-core"
version = "0.2.1"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PutiaCNC core: project model, geometry and G-code generation"

[workspace]
members = ["gui"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clipper-sys = "0.8"
usvg = "0.45"
ttf-parser = "0.25"

[[bin]]
name = "putia-gcode"
path = "src/bin/putia-gcode.rs"

[profile.release]
opt-level = 3
lto = true

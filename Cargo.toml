[package]
name = "putiacnc-core"
version = "0.6.0"
edition = "2021"
rust-version = "1.89"
license = "GPL-3.0-or-later"
description = "PutiaCNC core: project model, geometry and G-code generation"

[workspace]
members = ["gui"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clipper-sys = "0.8"
usvg = "0.45"
ttf-parser = "0.25"
visioncortex = { version = "0.9", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
rayon = "1"
sys-locale = "0.3"

[[bin]]
name = "putia-gcode"
path = "src/bin/putia-gcode.rs"

[[bin]]
name = "putia-i18n"
path = "src/bin/putia-i18n.rs"

[profile.release]
opt-level = 3
lto = true

[package]
name = "putiacnc-gui"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "PutiaCNC desktop app (egui)"

[[bin]]
name = "putiacnc"
path = "src/main.rs"

[dependencies]
putiacnc-core = { path = ".." }
rfd = "0.15"
eframe = { version = "0.27", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
ureq = { version = "2", default-features = false, features = ["native-tls"] }
native-tls = "0.2"
open = "5"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
png = "0.17"
fontdb = "0.23"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
